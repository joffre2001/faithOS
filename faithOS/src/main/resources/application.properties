spring.application.name=faithOS
spring.config.import=optional:file:.env[.properties],optional:file:faithOS/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.files.storage-path=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_FILE_SIZE:10MB}
server.forward-headers-strategy=framework
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://app.faithos.local,capacitor://app.faithos.local}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@faithos.app}
app.support.email=${SUPPORT_EMAIL:obensonjoffre3@gmail.com}
app.donations.pix-key=${PIX_KEY:eglisedechapeco2000@gmail.com}
app.data-encryption-key=${DATA_ENCRYPTION_KEY:${JWT_SECRET}}
app.retention.absence-days=${ABSENCE_RETENTION_DAYS:365}
app.retention.message-days=${MESSAGE_RETENTION_DAYS:730}
management.endpoint.health.show-details=never
