name: FaithOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: faithos_test
          POSTGRES_USER: faithos_test
          POSTGRES_PASSWORD: faithos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faithos_test -d faithos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: faithOS
    env:
      DB_URL: jdbc:postgresql://localhost:5432/faithos_test
      DB_USERNAME: faithos_test
      DB_PASSWORD: faithos_test_password
      JWT_SECRET: ci-only-synthetic-jwt-secret-that-is-long-enough-for-hs256-tests-2026
      AUTH_COOKIE_SECURE: "false"
      HIBERNATE_DDL_AUTO: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: faithOS/pom.xml
      - name: Run backend tests
        run: ./mvnw --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faithOS/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: faithOS/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
